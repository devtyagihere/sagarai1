  <path d="M7 31C10.5 28.5 14.5 32.5 18 31C21.5 29.5 25.5 33.5 29 31" stroke="url(#sagarWaveGrad2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
